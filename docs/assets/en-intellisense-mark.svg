<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="16 16 128 128" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">En-IntelliSense mark</title>
  <desc id="desc">A custom letter E built from editorial lines with an insertion cursor</desc>
  <style>
    .ink { fill: #18212b; }
    .cursor { fill: #2f7ee6; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f2f4f7; }
      .cursor { fill: #73a7ff; }
    }
  </style>
  <rect class="ink" x="30" y="27" width="22" height="106" rx="11"/>
  <rect class="ink" x="41" y="27" width="84" height="20" rx="10"/>
  <rect class="ink" x="41" y="70" width="62" height="20" rx="10"/>
  <rect class="ink" x="41" y="113" width="84" height="20" rx="10"/>
  <rect class="cursor" x="113" y="61" width="8" height="38" rx="4"/>
</svg>
