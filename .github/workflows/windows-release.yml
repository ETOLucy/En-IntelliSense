name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Build Windows executable
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/En-IntelliSense.exe#En-IntelliSense.exe" `
            "dist/En-IntelliSense.env.example#Model configuration example" `
            --title "En-IntelliSense ${{ github.ref_name }}" `
            --generate-notes
