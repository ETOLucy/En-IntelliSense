name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify
        run: |
          npm test
          npm run test:e2e

      - name: Build Windows artifacts
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run package:windows

      - name: Verify packaged desktop security boundary
        run: npm run test:desktop

      - name: Verify release artifacts
        run: npm run release:verify

      - name: Publish or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) { $tag = "v$((Get-Content package.json | ConvertFrom-Json).version)" }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "WriteMelo $tag" --generate-notes --prerelease
          }
          gh release upload $tag release/*.exe release/SHA256SUMS.txt --clobber
